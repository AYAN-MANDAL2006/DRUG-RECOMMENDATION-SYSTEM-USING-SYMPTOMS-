{% extends 'base.html' %}

{% block title %}Feedback & Contact - Drug Recommendation System{% endblock %}

{% block content %}
<div class="card" style="max-width: 700px; margin: 1rem auto;">
    <h2 class="card-title">Project Feedback & Contact</h2>
    <p style="color: var(--text-muted); margin-bottom: 1.5rem;">
        We value your feedback to improve this academic project. Please share your thoughts below.
    </p>

    <form action="{{ url_for('feedback') }}" method="POST">
        <div class="form-group">
            <label for="name" class="form-label">Full Name:</label>
            <input type="text" id="name" name="name" class="form-control" placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
            <label for="email" class="form-label">Email Address:</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
            <label for="rating" class="form-label">System Rating (1 to 5 Stars):</label>
            <select id="rating" name="rating" class="form-control" required>
                <option value="5">⭐⭐⭐⭐⭐ 5 - Excellent</option>
                <option value="4">⭐⭐⭐⭐ 4 - Very Good</option>
                <option value="3">⭐⭐⭐ 3 - Average</option>
                <option value="2">⭐⭐ 2 - Needs Improvement</option>
                <option value="1">⭐ 1 - Poor</option>
            </select>
        </div>

        <div class="form-group">
            <label for="message" class="form-label">Feedback / Suggestions:</label>
            <textarea id="message" name="message" rows="4" class="form-control" placeholder="Your comments..." required></textarea>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">Submit Feedback</button>
    </form>
</div>
{% endblock %}
